name: Build macOS desktop app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload assets to, for example v0.3.0"
        required: false
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          npm --prefix frontend ci
          npm --prefix desktop ci

      - name: Build macOS desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:desktop:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasySlide-macOS
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

      - name: Upload assets to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" desktop/dist/*.dmg desktop/dist/*.zip --clobber
